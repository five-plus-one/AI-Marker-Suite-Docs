name: Docs CI and delivery
on:
  push:
    branches: [docs-dev, main]
  pull_request:
    branches: [docs-dev, main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
concurrency:
  group: marker-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
jobs:
  build:
    runs-on: linux-amd64
    container:
      image: aimarker-ci:20261115
    strategy:
      matrix:
        include:
          - base: /
            flavor: root
          - base: /AI-Marker-Suite-Docs/
            flavor: pages
    steps:
      - name: Checkout source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify documentation
        run: node scripts/ci/build.cjs
        env:
          BASE_URL: ${{ matrix.base }}
      - name: Store verified documentation
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: docs-${{ matrix.flavor }}
          path: ci-output/
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: linux-amd64
    container:
      image: aimarker-ci:20261115
    steps:
      - name: Checkout delivery tools
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download root documentation
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: docs-root
          path: ci-output
      - name: Deliver documentation
        run: node scripts/ci/deploy.cjs
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          MARKER_DEPLOY_URL: ${{ secrets.MARKER_DEPLOY_URL }}
          MARKER_DEPLOY_TOKEN: ${{ secrets.MARKER_DEPLOY_TOKEN }}
      - name: Notify search engines
        run: node scripts/submit-indexnow.cjs
        continue-on-error: true
      - name: Store deployment receipt
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: docs-deployment-receipt
          path: ci-output/deployment-receipt.json
          retention-days: 30
          if-no-files-found: ignore
